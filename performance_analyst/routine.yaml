# 3. 김도현 (Performance Analyst)
agent:
  id: performance_analyst
  display_name: '김도현'
  role: '퍼포먼스 마케터'
  soul_ref: './SOUL.md'
  config_ref: './config.md'

triggers:
  - type: schedule
    name: daily_bid_review
    cron: '30 8 * * *' # 매일 08:30 (KST), 전일 데이터 기준
    task: run_bid_optimization
    description: >
      전일 Google Ads / Naver 성과 데이터를 조회하여 입찰/예산 조정안을 생성한다.

  - type: event
    name: on_tracking_alert
    listen_to: 'data_assistant.critical_alert'
    task: pause_recommendations
    description: >
      임지혁이 Critical 이상을 발행하면, 해당 데이터 기반 신규 제안 생성을
      일시 중단하고 기존 performance_execution_pending 항목도 재검토 대상으로 표시한다.

pre_task_context:
  - load: work_items.recent_history # 최근 제안/승인/반려 이력
  - load: data_assistant.tracking_status # 데이터 신뢰도 먼저 확인
  - load: knowledge/compliance_rules.md
  - load: examples/few_shot_cases.md

task: run_bid_optimization
steps:
  - step: check_tracking_status
    rule: >
      tracking_status == "Critical" → halt_task, notify: [data_assistant, dev_team]
      tracking_status == "Warning" → proceed_with_caution_flag
  - step: fetch_data
    sources: [google_ads, naver_searchad]
  - step: analyze
    model_call: true
    output_schema: performance_analyst_schema
  - step: classify
    rule: >
      abs(adjustment_percentage) > 20 OR action == "PAUSE" → require: operations_owner
      keyword.category in ["성범죄", "미성년자"] → route_to: compliance_review.queue (병행)
      else → route_to: performance_review.queue
  - step: record
    write_to: [work_items, approval_requests, audit_events]

handoff:
  default_target: performance_review.queue
  conditional:
    - condition: "abs(adjustment_percentage) <= 20 and action != 'PAUSE' and not sensitive_keyword"
      target: performance_review.queue
      note: '소폭 조정도 performance_approver 승인 후 실행 검토 대기로 이동.'
    - condition: 'sensitive_keyword == true'
      target: compliance_review.queue
      note: '조정폭과 무관하게 legal_compliance 승인 추가.'

escalation:
  - trigger: '동일 캠페인 human_approval 반려 3회 연속'
    notify: ['performance_approver']
    queue: 'pattern_alert.queue'
    message_template: >
      [김도현] {campaign} 캠페인 제안이 연속 반려됨. 전략 재검토 필요.

  - trigger: 'tracking_status == Critical 상태에서 제안 요청 발생'
    notify: ['operations_owner']
    queue: 'dev_team.queue'
    action: 'halt_current_batch'

  - trigger: '민감 키워드 조정 제안 >= 3건 (지난 24시간)'
    notify: ['legal_compliance']
    queue: 'compliance_review.queue'

retry_policy:
  schema_validation_fail: 2
  api_fetch_fail: 3
  backoff: exponential

audit:
  log_every_run: true
  fields: [timestamp, model_version, prompt_version, keyword, adjustment_percentage, action, routed_to]

interface:
  type: platform_adapter_pending
  approval_method: 'approval_service'
  queues:
    default:
      queue_ref: 'performance_review.queue'
    sensitive_keyword:
      queue_ref: 'compliance_review.queue'
  payload_fields: [keyword, action, adjustment_percentage, target_device, rationale]
