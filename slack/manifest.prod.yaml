display_information:
  name: Hermes
  description: 마케팅 콘텐츠 승인과 검토 대기열을 관리하는 Slack 앱
features:
  bot_user:
    display_name: Hermes
    always_online: false
  slash_commands:
    - command: /hermes-draft
      description: 콘텐츠 초안을 요청합니다
      usage_hint: 주제
      should_escape: false
    - command: /hermes-publish
      description: 승인된 콘텐츠와 수동 발행 기록을 확인합니다
      should_escape: false
    - command: /hermes-team
      description: 주간 콘텐츠·광고 브리핑을 요청합니다
      usage_hint: brief [normal|critical]
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
